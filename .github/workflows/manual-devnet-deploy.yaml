name: Manual Devnet Program Deploy

env:
  SOLANA_CLI_VERSION: 2.1.6

on:
  workflow_dispatch:
    inputs:
      program:
        description: "Program to deploy (e.g. helium-sub-daos)"
        required: true
        type: string
      branch:
        description: "Branch to deploy from"
        required: true
        default: "develop"
        type: string

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Set devnet lazy signer
        run: |
          find programs -type f -name '*.rs' -exec sed -i "s/b\"nJWGUMOK\"/b\"devnethelium5\"/g" {} \;

      - uses: actions/cache@v4
        name: Cache Toml Cli
        id: cache-toml-cli
        with:
          path: |
            ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}-v0002

      - run: (cargo install toml-cli || true)
        if: steps.cache-toml-cli.outputs.cache-hit != 'true'
        shell: bash

      - name: Set program information
        run: |
          PROGRAM_NAME=${PROGRAM//-/_}  # Substitute dashes with underscores
          # Prefer a devnet-specific id (programs.devnet) when one exists;
          # most programs share one id across clusters via programs.localnet.
          PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.devnet.${PROGRAM_NAME} 2>/dev/null | tr -d '"' || true)
          if [ -z "$PROGRAM_ID" ]; then
            PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.localnet.${PROGRAM_NAME} | tr -d '"')
          fi
          echo "Program: $PROGRAM_ID"
          echo "PROGRAM_NAME=${PROGRAM_NAME}" >> $GITHUB_ENV
          echo "PROGRAM_ID=${PROGRAM_ID}" >> $GITHUB_ENV
        env:
          PROGRAM: ${{ inputs.program }}

      # Only the IDL is taken from anchor; `build-verified` below produces the `.so` that ships.
      - uses: ./.github/actions/build-program-idl/
        id: build-program-idl
        with:
          devnet: true
          program: ${{ env.PROGRAM_NAME }}

      - uses: ./.github/actions/build-verified/
        id: build-verified
        with:
          devnet: true
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}

      - uses: ./.github/actions/setup-anchor/

      # Re-run rules live in `plan-deploy`: the hash-match skip, the vault buffer reuse and the
      # pending proposal check. It runs `@sqds/multisig` in the job with the devnet key: a matrix
      # leg cannot pass its outputs to another job. The mainnet release runs it in a job with no key.
      - uses: ./.github/actions/plan-deploy/
        id: plan
        with:
          devnet: true
          network: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.DEVNET_MULTISIG_VAULT }}
          multisig: ${{ secrets.DEVNET_MULTISIG }}
          spill: ${{ secrets.DEVNET_DEPLOYER_ADDRESS }}
      # Signers must reject the older proposal, or an execute of it after the new one rolls the
      # program back.
      - name: Report the older pending proposal
        if: steps.plan.outputs.pending-proposal-index != ''
        env:
          PROGRAM: ${{ inputs.program }}
          PENDING: ${{ steps.plan.outputs.pending-proposal-index }}
        run: |
          echo "::notice title=Older pending proposal::${PROGRAM}: proposal ${PENDING} is still pending"
      # On a failure before the authority transfer, this closes the buffer it made.
      - uses: ./.github/actions/deploy-buffers/
        id: deploy-buffers
        if: steps.plan.outputs.skip != 'true'
        with:
          network: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          keypair: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.DEVNET_MULTISIG_VAULT }}
          reused-buffer: ${{ steps.plan.outputs.buffer }}

      - name: Squads program upgrade
        # A skipped run has no buffers. The Squads action exits 1 on an empty address.
        if: steps.plan.outputs.skip != 'true'
        uses: helium/squads-program-upgrade@58eb5cf41491c163e857e6ee3dcedb97a2859733 # v0.5.0
        with:
          network-url: "https://api.devnet.solana.com"
          program-multisig: ${{ secrets.DEVNET_MULTISIG }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.deploy-buffers.outputs.buffer }}
          idl-buffer: ${{ steps.deploy-buffers.outputs.idl-buffer }}
          spill-address: ${{ secrets.DEVNET_DEPLOYER_ADDRESS }}
          authority: ${{ secrets.DEVNET_MULTISIG_VAULT }}
          name: "Deploy ${{ inputs.program }}"
          keypair: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}

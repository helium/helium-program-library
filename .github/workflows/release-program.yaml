name: Release Program to Mainnet

env:
  SOLANA_CLI_VERSION: 2.1.6

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "program-*" # Push events to matching program-*, i.e. program-circuit-breaker-0.0.1

permissions:
  contents: read

# The deployer key reaches two jobs only, `buffers` and `propose`, and neither installs the
# workspace. `@sqds/multisig` runs in `build` and `wait`, which hold no key.
jobs:
  build:
    runs-on: ubuntu-latest
    # The release uploads need `contents: write`.
    permissions:
      contents: write
    timeout-minutes: 120
    outputs:
      program: ${{ steps.tag.outputs.PROGRAM }}
      version: ${{ steps.tag.outputs.VERSION }}
      program-id: ${{ steps.tag.outputs.PROGRAM_ID }}
      program-name: ${{ steps.tag.outputs.PROGRAM_NAME }}
      skip: ${{ steps.plan.outputs.skip }}
      reused-buffer: ${{ steps.plan.outputs.buffer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          # The master ancestry guard in "Set tag information" needs `origin/master` and the
          # history between it and the tag.
          fetch-depth: 0
          # This job runs `@sqds/multisig` and has `contents: write`. The uploads pass their
          # token themselves, so the checkout keeps none in `.git/config`.
          persist-credentials: false

      - uses: actions/cache@v4
        name: Cache Toml Cli
        id: cache-toml-cli
        with:
          path: |
            ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}-v0002
      # `--locked` builds against the crate's own lockfile, so a dependency that later requires a
      # newer rustc than this runner has cannot break the install. A failure here is fatal: the
      # next step reads the program id with this binary, and an empty id reaches `anchor idl
      # write-buffer` several steps later as a missing argument.
      - run: cargo install toml-cli --locked
        if: steps.cache-toml-cli.outputs.cache-hit != 'true'
        shell: bash

      - name: Set tag information
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}  # Extract tag name from ref
          echo "Tag name: $TAG"
          # Strict: the tag list holds a `v`-prefixed tag and a `-test` suffixed one, and a loose
          # parse reads a program name or a version out of both.
          if [[ ! "$TAG" =~ ^program-([a-z0-9]+(-[a-z0-9]+)*)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag ${TAG} is not program-<name>-<x.y.z>"
            exit 1
          fi
          PROGRAM=${BASH_REMATCH[1]}
          VERSION=${BASH_REMATCH[3]}
          PROGRAM_NAME=${PROGRAM//-/_}  # Substitute dashes with underscores
          PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.localnet.${PROGRAM_NAME} | tr -d '"')

          # An id is what every step below addresses the program by, and an empty one is accepted
          # until `anchor idl write-buffer` rejects it as a missing argument, several steps away
          # from the tag that named no program Anchor.toml holds.
          if [ -z "$PROGRAM_ID" ]; then
            echo "::error::no program id for '${PROGRAM_NAME}' in Anchor.toml programs.localnet (tag ${TAG})"
            exit 1
          fi

          # A tag is never moved or reused, so a tag that disagrees with the source it points at
          # must stop here, before a build and before a release asset carries its name.
          CARGO_VERSION=$(~/.cargo/bin/toml get "programs/${PROGRAM}/Cargo.toml" package.version | tr -d '"')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} has version ${VERSION}, programs/${PROGRAM}/Cargo.toml at the tagged commit has '${CARGO_VERSION}'"
            exit 1
          fi

          # develop -> master is the gate for a mainnet deploy. A hand tag on any other commit
          # would deploy code that did not pass it.
          COMMIT=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::tag ${TAG} points at commit ${COMMIT}, which is not an ancestor of origin/master"
            exit 1
          fi

          echo "Program: $PROGRAM"
          echo "Program: $PROGRAM_ID"
          echo "Version: $VERSION"
          {
            echo "PROGRAM=${PROGRAM}"
            echo "VERSION=${VERSION}"
            echo "PROGRAM_ID=${PROGRAM_ID}"
            echo "PROGRAM_NAME=${PROGRAM_NAME}"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

      # Only the IDL is taken from anchor; `build-verified` below produces the `.so` that ships.
      - uses: ./.github/actions/build-program-idl/
        id: build-program-idl
        with:
          devnet: false
          program: ${{ env.PROGRAM_NAME }}

      - uses: ./.github/actions/build-verified/
        id: build-verified
        with:
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}

      # The release hash. The scheduled hash check compares the on-chain program with it. The
      # release carries it before `plan-deploy`, so a run that the hash-match skip stops still has it.
      - name: Write the release hash
        run: |
          HASH=$(~/.cargo/bin/solana-verify get-executable-hash "target/deploy/${PROGRAM_NAME}.so")
          echo "$HASH" > "target/deploy/${PROGRAM_NAME}.so.sha256"
          echo "Release hash: $HASH"

      # The release is made only after the verified build and its hash, so a failed build leaves
      # no release. A re-run replaces the assets.
      - name: Publish the release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            target/idl/${{ env.PROGRAM_NAME }}.json
            target/deploy/${{ env.PROGRAM_NAME }}.so.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stored before `plan-deploy` runs workspace JavaScript, so that code cannot change the binary the `buffers` job writes.
      - name: Store the build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            ./target/deploy/${{ env.PROGRAM_NAME }}.so
            ./target/idl/${{ env.PROGRAM_NAME }}.json

      # Re-run rules live in this action: the hash-match skip, the vault buffer reuse and the
      # pending proposal check.
      - uses: ./.github/actions/plan-deploy/
        id: plan
        with:
          network: ${{ secrets.SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.MULTISIG_VAULT }}
          multisig: ${{ secrets.MULTISIG }}
          spill: ${{ secrets.DEPLOYER_ADDRESS }}

  buffers:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The program buffer write retries up to 3 x 55 minutes.
    timeout-minutes: 180
    outputs:
      buffer: ${{ steps.deploy-buffers.outputs.buffer }}
      idl-buffer: ${{ steps.deploy-buffers.outputs.idl-buffer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-anchor/
      # `upload-artifact` drops the common `./target/` prefix of the two paths.
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./target/
      # On a failure before the authority transfer, this closes the buffer it made.
      - uses: ./.github/actions/deploy-buffers/
        id: deploy-buffers
        with:
          network: ${{ secrets.SOLANA_DEPLOY_URL }}
          program: ${{ needs.build.outputs.program-name }}
          keypair: ${{ secrets.DEPLOYER_KEYPAIR }}
          program-id: ${{ needs.build.outputs.program-id }}
          buffer-authority: ${{ secrets.MULTISIG_VAULT }}
          reused-buffer: ${{ needs.build.outputs.reused-buffer }}

  wait:
    needs: [build, buffers]
    runs-on: ubuntu-latest
    # Turnstyle lists this workflow's runs.
    permissions:
      contents: read
      actions: read
    # Turnstyle waits for earlier runs, so a batch of tags needs room past one release.
    timeout-minutes: 180
    outputs:
      skip: ${{ steps.pending.outputs.skip }}
      pending-proposal-index: ${{ steps.pending.outputs.pending-proposal-index }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Each run creates a Squads proposal at the multisig's next transaction index, and runs for
      # tags pushed together race on that index; the losers fail with ConstraintSeeds. Only the
      # proposal needs serializing, so builds and buffer uploads run in parallel and each run
      # waits here for every earlier-started run of this workflow to finish. A workflow-level
      # `concurrency` group is not used because GitHub keeps only one pending run per group and
      # cancels the rest, which silently dropped releases when several tags were pushed at once.
      - name: Wait for earlier release runs
        uses: softprops/turnstyle@3805450be63b8c80577dc253e8c17e9132036df4 # v3.3.3
        with:
          same-branch-only: false
          poll-interval-seconds: 30
          retries: 3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The read in `plan-deploy` ran before the wait, so a run that finished during it is
      # missing from that list. Read the older proposals again now that earlier runs are done.
      # A run that finished during the wait can also have proposed this same buffer: stop then.
      - name: Read older pending proposals after the wait
        id: pending
        env:
          PROGRAM: ${{ needs.build.outputs.program }}
          PROGRAM_ID: ${{ needs.build.outputs.program-id }}
          MULTISIG: ${{ secrets.MULTISIG }}
          SPILL: ${{ secrets.DEPLOYER_ADDRESS }}
          BUFFER: ${{ needs.buffers.outputs.buffer }}
          NETWORK: ${{ secrets.SOLANA_DEPLOY_URL }}
        run: |
          RESULT=$(SOLANA_URL="$NETWORK" node scripts/pending-upgrade-proposals.mjs --multisig "$MULTISIG" --program-id "$PROGRAM_ID" --spill "$SPILL" --buffer "$BUFFER")
          echo "$RESULT"
          SAME=$(echo "$RESULT" | jq -r '.sameBuffer // empty')
          if [ -n "$SAME" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "- \`$PROGRAM\`: pending proposal $SAME already names buffer \`$BUFFER\`. Stopped: no new proposal." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "pending-proposal-index=$(echo "$RESULT" | jq -r '.older | map(tostring) | join(",")')" >> "$GITHUB_OUTPUT"

  propose:
    needs: [build, buffers, wait]
    if: needs.wait.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Squads program upgrade
        uses: helium/squads-program-upgrade@58eb5cf41491c163e857e6ee3dcedb97a2859733 # v0.5.0
        with:
          network-url: "https://api.mainnet-beta.solana.com"
          program-multisig: ${{ secrets.MULTISIG }}
          program-id: ${{ needs.build.outputs.program-id }}
          buffer: ${{ needs.buffers.outputs.buffer }}
          idl-buffer: ${{ needs.buffers.outputs.idl-buffer }}
          spill-address: ${{ secrets.DEPLOYER_ADDRESS }}
          authority: ${{ secrets.MULTISIG_VAULT }}
          name: "Deploy ${{ needs.build.outputs.program-name }} ${{ needs.build.outputs.version }}"
          keypair: ${{ secrets.DEPLOYER_KEYPAIR }}

      # A second proposal for the same program is open. Signers must reject the old one, or an
      # execute of it after the new one rolls the program back. The annotation and the summary line
      # are the whole notice: the person who merged the Promotion PR is watching this run.
      - name: Report the older pending proposal
        if: needs.wait.outputs.pending-proposal-index != ''
        env:
          PROGRAM: ${{ needs.build.outputs.program }}
          VERSION: ${{ needs.build.outputs.version }}
          PENDING: ${{ needs.wait.outputs.pending-proposal-index }}
        run: |
          LINE="${PROGRAM} ${VERSION}: proposal ${PENDING} is still pending"
          echo "::notice title=Older pending proposal::${LINE}"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"

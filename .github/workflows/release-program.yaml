name: Release Program to Mainnet

env:
  SOLANA_CLI_VERSION: 2.1.6

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "program-*" # Push events to matching program-*, i.e. program-circuit-breaker-0.0.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          # The master ancestry guard in "Set tag information" needs `origin/master` and the
          # history between it and the tag.
          fetch-depth: 0

      - uses: actions/cache@v4
        name: Cache Toml Cli
        id: cache-toml-cli
        with:
          path: |
            ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}-v0002
      # `--locked` builds against the crate's own lockfile, so a dependency that later requires a
      # newer rustc than this runner has cannot break the install. A failure here is fatal: the
      # next step reads the program id with this binary, and an empty id reaches `anchor idl
      # write-buffer` several steps later as a missing argument.
      - run: cargo install toml-cli --locked
        if: steps.cache-toml-cli.outputs.cache-hit != 'true'
        shell: bash

      - name: Set tag information
        run: |
          TAG=${GITHUB_REF#refs/tags/}  # Extract tag name from ref
          echo "Tag name: $TAG"
          # Strict: the tag list holds a `v`-prefixed tag and a `-test` suffixed one, and a loose
          # parse reads a program name or a version out of both.
          if [[ ! "$TAG" =~ ^program-(.+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag ${TAG} is not program-<name>-<x.y.z>"
            exit 1
          fi
          PROGRAM=${BASH_REMATCH[1]}
          VERSION=${BASH_REMATCH[2]}
          # Written before the guards so the Slack step can name a release that a guard stopped.
          echo "PROGRAM=${PROGRAM}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          PROGRAM_NAME=${PROGRAM//-/_}  # Substitute dashes with underscores
          PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.localnet.${PROGRAM_NAME} | tr -d '"')

          # An id is what every step below addresses the program by, and an empty one is accepted
          # until `anchor idl write-buffer` rejects it as a missing argument, several steps away
          # from the tag that named no program Anchor.toml holds.
          if [ -z "$PROGRAM_ID" ]; then
            echo "::error::no program id for '${PROGRAM_NAME}' in Anchor.toml programs.localnet (tag ${TAG})"
            exit 1
          fi

          # A tag is never moved or reused, so a tag that disagrees with the source it points at
          # must stop here, before a build and before a release asset carries its name.
          CARGO_VERSION=$(~/.cargo/bin/toml get "programs/${PROGRAM}/Cargo.toml" package.version | tr -d '"')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} has version ${VERSION}, programs/${PROGRAM}/Cargo.toml at the tagged commit has '${CARGO_VERSION}'"
            exit 1
          fi

          # develop -> master is the gate for a mainnet deploy. A hand tag on any other commit
          # would deploy code that did not pass it.
          COMMIT=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::tag ${TAG} points at commit ${COMMIT}, which is not an ancestor of origin/master"
            exit 1
          fi

          echo "Program: $PROGRAM"
          echo "Program: $PROGRAM_ID"
          echo "Version: $VERSION"
          echo "PROGRAM_ID=${PROGRAM_ID}" >> $GITHUB_ENV
          echo "PROGRAM_NAME=${PROGRAM_NAME}" >> $GITHUB_ENV

      # Only the IDL is taken from anchor; `build-verified` below produces the `.so` that ships.
      - uses: ./.github/actions/build-program-idl/
        id: build-program-idl
        with:
          devnet: false
          program: ${{ env.PROGRAM_NAME }}

      - name: Push IDL to Github
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/idl/${{ env.PROGRAM_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-verified/
        id: build-verified
        with:
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}

      # The release hash. The scheduled hash check compares the on-chain program with it. It
      # uploads before `deploy-buffers`, so a run that the hash-match skip stops still has it.
      - name: Write the release hash
        run: |
          HASH=$(~/.cargo/bin/solana-verify get-executable-hash "target/deploy/${PROGRAM_NAME}.so")
          echo "$HASH" > "target/deploy/${PROGRAM_NAME}.so.sha256"
          echo "Release hash: $HASH"

      # The IDL step above made the release for this tag. `--clobber` lets a re-run replace the
      # asset, as the IDL step does.
      - name: Push release hash to Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "target/deploy/${PROGRAM_NAME}.so.sha256" --clobber

      # Re-run rules live in this action: the hash-match skip, the vault buffer reuse, the
      # pending proposal check, and the close of this run's buffer on a failure.
      - uses: ./.github/actions/deploy-buffers/
        id: deploy-buffers
        with:
          network: ${{ secrets.SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          keypair: ${{ secrets.DEPLOYER_KEYPAIR }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.MULTISIG_VAULT }}
          multisig: ${{ secrets.MULTISIG }}

      # Each run creates a Squads proposal at the multisig's next transaction index, and runs for
      # tags pushed together race on that index; the losers fail with ConstraintSeeds. Only this
      # last step needs serializing, so builds and buffer uploads run in parallel and each run
      # waits here for every earlier-started run of this workflow to finish. A workflow-level
      # `concurrency` group is not used because GitHub keeps only one pending run per group and
      # cancels the rest, which silently dropped releases when several tags were pushed at once.
      - name: Wait for earlier release runs
        if: steps.deploy-buffers.outputs.skip != 'true'
        uses: softprops/turnstyle@v3.3.3
        with:
          same-branch-only: false
          poll-interval-seconds: 30
          retries: 3

      - name: Squads program upgrade
        # A skipped run has no buffers. The Squads action exits 1 on an empty address.
        if: steps.deploy-buffers.outputs.skip != 'true'
        uses: helium/squads-program-upgrade@v0.5.0
        with:
          network-url: "https://api.mainnet-beta.solana.com"
          program-multisig: ${{ secrets.MULTISIG }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.deploy-buffers.outputs.buffer }}
          idl-buffer: ${{ steps.deploy-buffers.outputs.idl-buffer }}
          spill-address: ${{ secrets.DEPLOYER_ADDRESS }}
          authority: ${{ secrets.MULTISIG_VAULT }}
          name: "Deploy ${{env.PROGRAM_NAME}} ${{env.VERSION}}"
          keypair: ${{ secrets.DEPLOYER_KEYPAIR }}

      # A second proposal for the same program is open. Signers must reject the old one, or an
      # execute of it after the new one rolls the program back.
      - name: "Slack: older pending proposal"
        if: steps.deploy-buffers.outputs.skip != 'true' && steps.deploy-buffers.outputs.pending-proposal-index != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          PENDING: ${{ steps.deploy-buffers.outputs.pending-proposal-index }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_RELEASE_WEBHOOK is not set. No notice sent."
            exit 0
          fi
          TEXT="Program release: proposal created for ${PROGRAM} ${VERSION}. Reject the older pending proposal(s) ${PENDING} for this program. ${RUN_URL}"
          # The proposal exists by now, so a Slack outage must not fail the release run.
          # curl's stderr can hold the webhook URL, so it is dropped.
          if ! jq -nc --arg text "$TEXT" '{text: $text}' | curl -sS --fail --max-time 30 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK" > /dev/null 2>&1; then
            echo "::warning::the Slack notice was not sent"
          fi

      - name: "Slack: release failed"
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_RELEASE_WEBHOOK is not set. No notice sent."
            exit 0
          fi
          # PROGRAM and VERSION are empty when the tag did not parse. The tag is always there.
          TEXT="Program release FAILED: ${PROGRAM:-?} ${VERSION:-?} (tag ${GITHUB_REF_NAME}). ${RUN_URL}"
          # curl's stderr can hold the webhook URL, so it is dropped.
          if ! jq -nc --arg text "$TEXT" '{text: $text}' | curl -sS --fail --max-time 30 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK" > /dev/null 2>&1; then
            echo "::warning::the Slack notice was not sent"
          fi

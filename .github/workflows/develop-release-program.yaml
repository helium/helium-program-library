name: Deploy Programs to devnet

env:
  SOLANA_CLI_VERSION: 2.1.6

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  detect_changed_programs:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'deploy-to-devnet')
    runs-on: ubuntu-latest
    outputs:
      programs_with_changes: ${{ steps.list_changed_programs.outputs.programs_with_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # The script diffs two commits, so both ends must be in the checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: List changed programs
        id: list_changed_programs
        # A program changes when its own sources or a workspace crate it depends on
        # do. `shared-utils` is such a crate, so it now deploys its dependents; the
        # hash-match skip in `deploy-buffers` stops the legs whose binary is the same.
        env:
          # `github.event.after` is empty on a pull_request, so the head is explicit.
          BASE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
          HEAD: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.event.after }}
        run: |
          CHANGED=$(node scripts/changed-programs.mjs "$BASE" "$HEAD")
          echo "$CHANGED"
          JSON=$(echo "$CHANGED" | jq -c '[.[].name]')
          echo "programs_with_changes=$JSON" >> "$GITHUB_OUTPUT"

          # No devnet tag and no version in the proposal name, so the run summary is
          # the record of what each deployed binary was built from.
          while IFS=$'\t' read -r PROGRAM VIA; do
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "programs/$PROGRAM/Cargo.toml" | head -n 1)
            NOTE=""
            if [ -n "$VIA" ]; then NOTE=" (dependent of \`$VIA\`)"; fi
            echo "- \`$PROGRAM\`: version \`$VERSION\`, commit \`$HEAD\`$NOTE" >> "$GITHUB_STEP_SUMMARY"
          done < <(echo "$CHANGED" | jq -r '.[] | [.name, (if .own then "" else (.via | join(", ")) end)] | @tsv')
  build_programs:
    needs: [detect_changed_programs]
    runs-on: ubuntu-latest
    if: needs.detect_changed_programs.outputs.programs_with_changes != '[]' && needs.detect_changed_programs.outputs.programs_with_changes != ''
    strategy:
      matrix:
        program: ${{ fromJson(needs.detect_changed_programs.outputs.programs_with_changes) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set devnet lazy signer
        run: |
          find programs -type f -name '*.rs' -exec sed -i "s/b\"nJWGUMOK\"/b\"devnethelium5\"/g" {} \;

      - uses: actions/cache@v4
        name: Cache Toml Cli
        id: cache-toml-cli
        with:
          path: |
            ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}-v0002

      - run: (cargo install toml-cli || true)
        if: steps.cache-toml-cli.outputs.cache-hit != 'true'
        shell: bash

      - name: Set program information
        run: |
          PROGRAM_NAME=${PROGRAM//-/_}  # Substitute dashes with underscores
          # Prefer a devnet-specific id (programs.devnet) when one exists;
          # most programs share one id across clusters via programs.localnet.
          PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.devnet.${PROGRAM_NAME} 2>/dev/null | tr -d '"' || true)
          if [ -z "$PROGRAM_ID" ]; then
            PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.localnet.${PROGRAM_NAME} | tr -d '"')
          fi
          echo "Program: $PROGRAM_ID"
          echo "PROGRAM_NAME=${PROGRAM_NAME}" >> $GITHUB_ENV
          echo "PROGRAM_ID=${PROGRAM_ID}" >> $GITHUB_ENV
        env:
          PROGRAM: ${{ matrix.program }}

      # Only the IDL is taken from anchor; `build-verified` below produces the `.so` that ships.
      - uses: ./.github/actions/build-program-idl/
        id: build-program-idl
        with:
          devnet: true
          program: ${{ env.PROGRAM_NAME }}

      - uses: ./.github/actions/build-verified/
        id: build-verified
        with:
          devnet: true
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}

      - name: Store so files
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.program}}-so
          path: |
            ./target/deploy/${{env.PROGRAM_NAME}}.so
      - name: Store idl files
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.program}}-idl
          path: |
            ./target/idl/${{env.PROGRAM_NAME}}.json

  publish_programs:
    needs: [detect_changed_programs, build_programs]
    runs-on: ubuntu-latest
    if: needs.detect_changed_programs.outputs.programs_with_changes != '[]' && needs.detect_changed_programs.outputs.programs_with_changes != ''
    strategy:
      # Publish must happen one at a time or there can be conflicts
      max-parallel: 1
      matrix:
        program: ${{ fromJson(needs.detect_changed_programs.outputs.programs_with_changes) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: ./.github/actions/setup-anchor/
      - name: Set program information
        run: |
          PROGRAM_NAME=${PROGRAM//-/_}  # Substitute dashes with underscores
          # Prefer a devnet-specific id (programs.devnet) when one exists;
          # most programs share one id across clusters via programs.localnet.
          PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.devnet.${PROGRAM_NAME} 2>/dev/null | tr -d '"' || true)
          if [ -z "$PROGRAM_ID" ]; then
            PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.localnet.${PROGRAM_NAME} | tr -d '"')
          fi
          echo "Program: $PROGRAM_ID"
          echo "PROGRAM_NAME=${PROGRAM_NAME}" >> $GITHUB_ENV
          echo "PROGRAM_ID=${PROGRAM_ID}" >> $GITHUB_ENV
        env:
          PROGRAM: ${{ matrix.program }}

      - name: Download a so files
        uses: actions/download-artifact@v4
        with:
          name: ${{matrix.program}}-so
          path: ./target/deploy/
      - name: Download idl files
        uses: actions/download-artifact@v4
        with:
          name: ${{matrix.program}}-idl
          path: ./target/idl/
      # Re-run rules live in `plan-deploy`: the hash-match skip, the vault buffer reuse and the
      # pending proposal check. It runs `@sqds/multisig` in the job with the devnet key: a matrix
      # leg cannot pass its outputs to another job. The mainnet release runs it in a job with no key.
      - uses: ./.github/actions/plan-deploy/
        id: plan
        with:
          devnet: true
          network: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.DEVNET_MULTISIG_VAULT }}
          multisig: ${{ secrets.DEVNET_MULTISIG }}
          spill: ${{ secrets.DEVNET_DEPLOYER_ADDRESS }}
      # Signers must reject the older proposal, or an execute of it after the new one rolls the
      # program back.
      - name: Report the older pending proposal
        if: steps.plan.outputs.pending-proposal-index != ''
        env:
          PROGRAM: ${{ matrix.program }}
          PENDING: ${{ steps.plan.outputs.pending-proposal-index }}
        run: |
          echo "::notice title=Older pending proposal::${PROGRAM}: proposal ${PENDING} is still pending"
      # On a failure before the authority transfer, this closes the buffer it made.
      - uses: ./.github/actions/deploy-buffers/
        id: deploy-buffers
        if: steps.plan.outputs.skip != 'true'
        with:
          network: ${{ secrets.DEVNET_SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          keypair: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.DEVNET_MULTISIG_VAULT }}
          reused-buffer: ${{ steps.plan.outputs.buffer }}
      - name: Squads program upgrade
        # A skipped run has no buffers. The Squads action exits 1 on an empty address.
        if: steps.plan.outputs.skip != 'true'
        uses: helium/squads-program-upgrade@58eb5cf41491c163e857e6ee3dcedb97a2859733 # v0.5.0
        with:
          network-url: "https://api.devnet.solana.com"
          program-multisig: ${{ secrets.DEVNET_MULTISIG }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.deploy-buffers.outputs.buffer }}
          idl-buffer: ${{ steps.deploy-buffers.outputs.idl-buffer }}
          spill-address: ${{ secrets.DEVNET_DEPLOYER_ADDRESS }}
          authority: ${{ secrets.DEVNET_MULTISIG_VAULT }}
          name: "Deploy ${{ matrix.program }}"
          keypair: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}

name: NPM Publish

env:
  SOLANA_CLI_VERSION: 2.1.6

permissions:
  id-token: write
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 1>/dev/null 2>&1 && [ "$(ls .changeset/*.md 2>/dev/null | wc -l)" -gt 0 ]; then
            non_readme=$(ls .changeset/*.md | grep -v README.md | head -1 || true)
            if [ -n "$non_readme" ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release PR
        if: steps.check.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `@helium/idls` is the only published package built from the anchor
      # output, and it compiles target/types alone (packages/idls/tsconfig.*).
      # `anchor idl build` writes those without the SBF compile, which costs
      # 1.4 min median, 13.6 min p90 on a cache miss. The action runs
      # setup-anchor itself when its cache misses, so no separate setup step
      # is needed.
      - name: Build IDLs
        if: steps.check.outputs.has_changesets == 'false'
        uses: ./.github/actions/build-idls/

      - name: Build all packages
        if: steps.check.outputs.has_changesets == 'false'
        run: pnpm turbo run build --filter='!@helium/blockchain-api-service' --filter='!hpl-docs'

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'false'
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

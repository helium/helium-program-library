name: Tests

# A push to develop is a cache seed run, not a test run: only the `build` job runs, so that a PR
# into develop can restore a `testing=true` `target/` cache and the base IDLs its merge commit will
# be diffed against. Every other job carries
#   if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
# to opt out of that run. The gate is a job-level `if:` and never a workflow-level `paths` filter,
# so a required check can never sit pending.
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
env:
  SOLANA_CLI_VERSION: 2.1.6

jobs:
  test-rust-lint:
    name: Test Rust Lint
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup/
      # Every other job takes its compiler from setup-anchor's `rustup default 1.85.0`; this one
      # does not run setup-anchor, so without a version here it takes whatever the runner image
      # ships and the gate drifts away from the code. It cannot simply reuse 1.85.0: the clippy
      # flags below name lints that only exist in a later release, and an unknown lint is itself
      # an error under `-D warnings`. Bump this deliberately, and expect new lints when you do.
      - run: rustup install 1.98.0 --component clippy,rustfmt --profile minimal && rustup default 1.98.0
      - uses: actions/cache@v4
        name: Cache Cargo registry + index
        id: cache-cargo-build
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked
      - run: cargo fmt -- --check
      # or_fun_call is on because `ok_or(error!(..))` builds the error on the success path too,
      # and an AnchorError owns two Strings. The heap a program gets is a bump allocator that
      # never frees, so errors that are never returned still consume it.
      - run: cargo clippy --all-targets -- -D warnings -D clippy::or_fun_call -A clippy::result_large_err -A clippy::too_many_arguments -A clippy::uninlined-format-args -A clippy::manual_is_multiple_of -A ambiguous_glob_reexports -A unexpected-cfgs

  backstop:
    name: Release Declaration
    # The backstop behind the changeset bot. It reads the bot's own rule
    # (`scripts/missing-changesets.mjs`) and does not care who wrote the file,
    # so it runs on drafts and on forks, where the bot cannot: a fork's token
    # is read-only, so its author reads the fix from this failure.
    # Skipped on the heads that carry releases rather than declare them: the
    # two release PRs, the Promotion PR (head develop) and the back-merge PR
    # (head master). Not a required check.
    # A fork can name its branch anything, so the skips apply to this repository's heads only.
    # Anyone with push access can name a branch `changeset-release/` or `program-release/`, so
    # those skips also need a bot author. Only a GitHub App or the Actions token opens a PR as a
    # bot. `develop` and `master` already exist, so no one can open a new branch with that name.
    if: >-
      github.event_name == 'pull_request'
      && (github.event.pull_request.head.repo.full_name != github.repository
        || (github.head_ref != 'develop'
          && github.head_ref != 'master'
          && !(github.event.pull_request.user.type == 'Bot'
            && (startsWith(github.head_ref, 'changeset-release/')
              || startsWith(github.head_ref, 'program-release/')))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Changed packages and programs
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/changed-packages.mjs "$BASE_SHA" > "$RUNNER_TEMP/packages.json"
          node scripts/changed-programs.mjs "$BASE_SHA" > "$RUNNER_TEMP/programs.json"
          echo "programs=$(jq -r 'map(.name) | join(" ")' "$RUNNER_TEMP/programs.json")" >> "$GITHUB_OUTPUT"

      # A program's IDL moves with its own source or with a workspace crate
      # whose types it embeds, so every changed program is diffed, and only a
      # moved IDL makes `@helium/idls` a changed package. Every step is skipped
      # when no program changed.
      - name: Diff the IDLs
        id: idl-diff
        uses: ./.github/actions/idl-diff/
        with:
          programs: ${{ steps.changed.outputs.programs }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          target-artifact: ""

      - name: Every changed package and program declares a release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IDL_DIFF: ${{ steps.idl-diff.outputs.diff-file }}
        run: |
          args=(--packages "$RUNNER_TEMP/packages.json" --programs "$RUNNER_TEMP/programs.json")
          if [ -n "$IDL_DIFF" ]; then
            args+=(--idl-diff "$IDL_DIFF")
          fi
          node scripts/backstop-check.mjs "$BASE_SHA" HEAD "${args[@]}"

  missing-bump:
    name: Program Version Bumps
    # The last gate before program source reaches master. The backstop asks a
    # PR to declare its releases and an admin can bypass it; this one asks the
    # tags, which cannot be argued with: a program whose current version is
    # already tagged and whose source moved since that tag would deploy under a
    # version that is already on chain. Not a required check.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The check reads every `program-*` tag and diffs from the tagged commit,
      # so a shallow clone without tags would pass it vacuously.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Every changed program has a version bump
        run: |
          node scripts/missing-bump-check.mjs --json "$RUNNER_TEMP/missing-bump.json"

  # The release scripts decide what deploys to mainnet. No develop-seed skip: a push to develop
  # runs them too.
  test-release-scripts:
    name: Release Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The pending-proposal tests import `@sqds/multisig` from the workspace.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test 'scripts/*.test.mjs'

  test-unit:
    name: Rust Unit Tests
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup/
      - uses: actions/cache@v4
        name: Cache Cargo registry + index
        id: cache-cargo-build
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --locked
      - run: cargo test --lib

  test-testing-guard:
    name: TESTING Build Guard
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup/
      - uses: actions/cache@v4
        name: Cache Cargo registry + index
        id: cache-cargo-build
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      # Scope: every program whose src reads TESTING, enumerated from the source rather
      # than from a list, so a new program that reads TESTING without a guard fails here, and
      # under both default features and `--features devnet`, so a devnet-exempt guard fails too.
      # Trigger: this workflow has no path filter, so the job runs on every pull request
      # whatever it touches.
      - name: A leaked TESTING refuses to compile, and a deliberate test build does not
        run: |
          set -euo pipefail
          # `|| true` so a no-match grep does not abort the step under `set -e`, which would
          # skip the empty-enumeration refusal below and end the run before it could report.
          PROGRAMS=$(grep -rl 'option_env!("TESTING")' programs/*/src | cut -d/ -f2 | sort -u || true)
          if [ -z "$PROGRAMS" ]; then
            echo "::error::no program reads TESTING; this check is measuring nothing"
            exit 1
          fi
          COUNT=$(printf '%s\n' "$PROGRAMS" | wc -l | tr -d ' ')
          echo "Programs that read TESTING ($COUNT):"
          printf '  %s\n' $PROGRAMS
          CHECKED=0
          for p in $PROGRAMS; do
            echo "--- $p"
            for features in "" "--features devnet"; do
              if TESTING=1 cargo check -p "$p" $features > /tmp/leak.log 2>&1; then
                echo "::error::$p compiles with TESTING set and no HELIUM_TEST_BUILD (features: ${features:-default}); the guard is missing or ineffective"
                exit 1
              fi
              # Assert the reason, not just the failure: any other compile error would
              # otherwise read as the guard doing its job.
              if ! grep -q "TESTING is set without HELIUM_TEST_BUILD" /tmp/leak.log; then
                echo "::error::$p failed to compile with TESTING set (features: ${features:-default}), but not because of the guard"
                tail -40 /tmp/leak.log
                exit 1
              fi
            done
            if ! TESTING=1 HELIUM_TEST_BUILD=1 cargo check -p "$p" > /tmp/ack.log 2>&1; then
              echo "::error::$p does not compile as a deliberate test build"
              tail -40 /tmp/ack.log
              exit 1
            fi
            CHECKED=$((CHECKED + 1))
          done
          if [ "$CHECKED" != "$COUNT" ]; then
            echo "::error::checked $CHECKED of $COUNT programs"
            exit 1
          fi
          echo "Guard verified in $CHECKED programs"

  test-atomic-data-publisher:
    name: Atomic Data Publisher Tests
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atomic_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup/
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        name: Cache Cargo registry + index
        id: cache-cargo-build
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --locked
        working-directory: utils/atomic-data-publisher
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/atomic_test

  build:
    name: Build Anchor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/build-anchor/
        with:
          testing: true
      - uses: ./.github/actions/localnet-accounts/
      # Every `needs: build` job takes the build from here instead of restoring the same `target/`
      # cache itself. Only the three directories those jobs read are uploaded: `target/deploy` (the
      # .so files and program keypairs `anchor localnet --skip-build` loads), `target/idl` and
      # `target/types` (what `@helium/idls` compiles).
      - name: Upload anchor build
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: |
            target/deploy
            target/idl
            target/types
          retention-days: 1
          if-no-files-found: error
      # The changeset bot's IDL diff needs the IDLs of the commit a PR is based on. Only a develop
      # run can save them under a SHA a later PR will ask for: a PR run builds a merge commit whose
      # SHA nothing else ever names. Save only, because this run has nothing to restore.
      - name: Save base IDLs
        if: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
        uses: actions/cache/save@v4
        with:
          path: ./target/idl
          key: base-idls-${{ github.sha }}

  test-devflow:
    needs: build
    name: Test Development Workflow
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/build-anchor/
        with:
          testing: true
          target-artifact: anchor-build
      - uses: ./.github/actions/setup-ts/
      - uses: ./.github/actions/localnet-accounts/
      - uses: ./.github/actions/start-localnet/
      - name: Run bootstrap script
        run: ./scripts/bootstrap.sh

  test-helium-vote-service:
    needs: build
    name: Test Helium Vote Service
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/build-anchor/
        with:
          testing: true
          target-artifact: anchor-build
      - uses: ./.github/actions/setup-ts/
      - run: pnpm --filter @helium/helium-vote-service test

  test-migration-service:
    needs: build
    name: Test Migration Service
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/build-anchor/
        with:
          testing: true
          target-artifact: anchor-build
      - uses: ./.github/actions/setup-ts/
      - run: pnpm --filter @helium/migration-service test

  test-docker-builds:
    needs: build
    name: Test Docker Builds
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test:
          - utils/ecc-sig-verifier
          - utils/atomic-data-publisher
          - packages/monitor-service
          - packages/faucet-service
          - packages/metadata-service
          - packages/distributor-oracle
          - packages/account-postgres-sink-service
          - packages/fanout-metadata-service
          - packages/tokens-to-rent-service
          - packages/rewards-oracle-faucet-service
          - packages/vsr-metadata-service
          - packages/crons
          - packages/geocoder-service
          - packages/recent-helium-transactions-service
          - packages/blockchain-api
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/build-anchor/
        if: startsWith(matrix.test, 'packages/')
        with:
          testing: true
          target-artifact: anchor-build
      - uses: ./.github/actions/setup-ts/
        if: startsWith(matrix.test, 'packages/')
      - name: Build idls package
        if: startsWith(matrix.test, 'packages/')
        run: pnpm turbo run build --filter=@helium/idls
      - name: Free disk space
        # Hosted runners ship ~14GB free but waste tens of GB on toolchains the
        # Docker build never uses; the heavier images (e.g. blockchain-api) hit
        # "No space left on device". Reclaim it before building.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      - name: Build Docker image
        run: |
          # JS services with turbo prune build from repo root
          # Other services (utils/*, geocoder) build from their own directory
          if grep -q "turbo prune" "$DOCKER_PATH/Dockerfile" 2>/dev/null; then
            docker build -f $DOCKER_PATH/Dockerfile .
          else
            cd $DOCKER_PATH && docker build .
          fi
        env:
          DOCKER_PATH: ${{ matrix.test }}

  test-rust-builds:
    needs: build
    name: Test Rust Builds
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test:
          - utils/ecc-sig-verifier
          - utils/hpl-utils
          - utils/migration-tx-executor
          - utils/vehnt
    steps:
      - uses: actions/checkout@v3
      # These four crates are `exclude`d from the root workspace, so they never read the workspace
      # `target/`; the artifact is taken only to keep them off the cache and out of a cold
      # `anchor build`. What they need from this action is the pinned toolchain and the cargo
      # registry cache.
      - uses: ./.github/actions/build-anchor/
        with:
          testing: true
          target-artifact: anchor-build
      - run: cd $RUST_PATH && cargo build
        env:
          RUST_PATH: ${{ matrix.test }}

  test-contracts:
    needs: build
    name: Test Anchor Contracts
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/circuit-breaker.ts
          - tests/data-credits.ts
          - tests/distributor-oracle.ts
          - tests/helium-entity-manager.ts
          - tests/mobile-entity-manager.ts
          - tests/helium-sub-daos.ts
          - tests/helium-sub-daos-vehnt-cases-2-3.ts
          - tests/helium-sub-daos-vehnt-cases-4-5.ts
          - tests/hexboosting.ts
          - tests/hpl-crons.ts
          - tests/lazy-distributor.ts
          - tests/lazy-transactions.ts
          - tests/treasury-management.ts
          - tests/price-oracle.ts
          - tests/voter-stake-registry.ts
          - tests/fanout.ts
          - tests/sus.ts
          - tests/mini-fanout.ts
          - tests/mini-fanout-bankrun.ts
          - tests/welcome-pack.ts
          - tests/dc-auto-topoff.ts
          - tests/dc-auto-topoff-bankrun.ts
          - tests/dca-server-binding.ts
          - tests/tuktuk-dca.ts
          - tests/priority-fees.ts
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/build-anchor/
        with:
          testing: true
          target-artifact: anchor-build
      - uses: ./.github/actions/setup-ts/
      - uses: ./.github/actions/localnet-accounts/
      - uses: ./.github/actions/start-localnet/
      - run: ANCHOR_WALLET=${HOME}/.config/solana/id.json pnpm exec ts-mocha -p ./tsconfig.test.json -t 1000000 --exit $TEST
        env:
          TESTING: true
          TEST: ${{ matrix.test }}
          ANCHOR_PROVIDER_URL: http://localhost:8899
      - name: Check CU table covers test traffic
        # priority-fees.ts (mocked), sus.ts (remote RPC), dca-server-binding.ts (a stubbed
        # program behind an injected HTTP request) and the bankrun suites (in-process, no
        # validator) never commit localnet traffic, so the CU sampler legitimately sees 0 —
        # don't gate them. A suite added here that does not reach localnet belongs in this list.
        if: >-
          matrix.test != 'tests/priority-fees.ts'
          && matrix.test != 'tests/sus.ts'
          && matrix.test != 'tests/dca-server-binding.ts'
          && !endsWith(matrix.test, '-bankrun.ts')
        run: pnpm run check-cu-table
        working-directory: packages/spl-utils
        env:
          RPC_URL: http://localhost:8899

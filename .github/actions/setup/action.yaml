name: "Setup"
description: "Setup"
runs:
  using: "composite"
  steps:
    # Runner-preinstalled Microsoft repos (azure-cli etc.) intermittently
    # serve corrupt indexes and fail apt-get update; nothing here needs them.
    - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* /etc/apt/sources.list.d/azure-cli*
      shell: bash
    # The runner image points apt at a mirror list headed by azure.archive.ubuntu.com.
    # On 2026-11-10/11 that host stopped resolving for hours and failed every apt-get
    # install, while archive.ubuntu.com kept answering. Use the global archive directly.
    - run: |
        for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
          [ -f "$f" ] && sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g; s#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$f"
        done
        grep -rh '^URIs:\|^deb ' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
      shell: bash
    # apt has no timeout by default, so a mirror that accepts the connection and then
    # stalls hangs the step until the job's own cap. Observed repeatedly: a fetch of
    # archive.ubuntu.com InRelease going silent for 44 minutes. Retries cover a mirror
    # that fails outright. `timeout-minutes` is not available on composite-action steps,
    # so the bound is set once in apt.conf.d and every later apt-get in the job inherits it.
    - run: |
        printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
        sudo apt-get update
      shell: bash
    - run: sudo apt-get install -y pkg-config build-essential libudev-dev
      shell: bash
      # TODO: We're on anchor latest because of https://github.com/coral-xyz/anchor/issues/2568
      # On anchor 0.28.1 we can probably stop using 0 as the source
    - run: echo "ANCHOR_VERSION=0.31.2" >> $GITHUB_ENV
      shell: bash
    - run: echo "ANCHOR_SHA=3e8bc76d72e2bfdb3962868b5066" >> $GITHUB_ENV
      shell: bash
    # The commit of the `v0.31.2` tag. A tag can move; a commit cannot.
    # The build and IDL caches do not key on this rev. When it changes without ANCHOR_VERSION,
    # change the cache keys in build-anchor/action.yaml and build-idls/action.yaml too.
    - run: echo "ANCHOR_VERSION_REV=6f152a48f266eb187b2a3cc22f1cc7d1ae5bdbd3" >> $GITHUB_ENV
      shell: bash
    - run: git submodule update --init --recursive --depth 1
      shell: bash

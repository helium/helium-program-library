name: "Build Verified"
description: "Builds an Anchor Program using solana-verify"
inputs:
  devnet:
    description: "Whether to use devnet feature"
    required: false
    default: "false"
  testing:
    description: "Whether to build with test values (sets TESTING and the testing feature)"
    required: false
    default: "false"
  program:
    description: "The program to build and upload"
    required: true
  program-id:
    description: "The program id of the program we are uploading"
    required: true

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup/
    - uses: ./.github/actions/setup-anchor/
    - uses: actions/cache@v4
      name: Cache Cargo registry + index
      id: cache-cargo-registry
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-v0001-${{ hashFiles('**/Cargo.lock') }}
    - uses: actions/cache@v4
      name: Cache Solana Verify
      id: cache-solana-verify
      with:
        path: |
          ~/.cargo/bin/solana-verify
        key: cargo-${{ runner.os }}-solana-verify-0.5.0
    # Pinned: solana-verify 0.5.1+ pulls deps (solana-address, solana-system-interface)
    # that require rustc 1.89, but the build toolchain is pinned to 1.85. 0.5.0 is the
    # newest release that still builds on 1.85. Bump alongside the rustc pin.
    - run: cargo install solana-verify --version 0.5.0 --locked --force
      if: steps.cache-solana-verify.outputs.cache-hit != 'true'
      shell: bash
    # The programs refuse to compile when TESTING is set without the `testing` feature, so
    # a test build carries both.
    - run: |
        FEATURES=""
        if [ "$DEVNET" = "true" ]; then FEATURES="devnet"; fi
        if [ "$TESTING_BUILD" = "true" ]; then
          export TESTING=true
          FEATURES="${FEATURES:+$FEATURES,}testing"
        fi
        ARGS=()
        if [ -n "$FEATURES" ]; then ARGS+=(-- --features "$FEATURES"); fi
        ~/.cargo/bin/solana-verify build --library-name "$PROGRAM" "${ARGS[@]}"
      shell: bash
      env:
        DEVNET: ${{ inputs.devnet }}
        TESTING_BUILD: ${{ inputs.testing }}
        PROGRAM: ${{ inputs.program }}

name: "Setup Anchor"
description: "Setup Anchor"
inputs:
  devnet:
    description: "Whether to use devnet feature"
    required: false
    default: "false"
  testing:
    description: "Whether to build with test values (sets TESTING and HELIUM_TEST_BUILD)"
    required: false
    default: "false"
  program:
    description: "The program to build"
    required: false
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup/
    - uses: ./.github/actions/setup-anchor/
    - uses: actions/cache@v4
      name: Cache Cargo registry + index
      id: cache-cargo-registry
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
    # Key layout: build-<os>-<anchor version>-<anchor sha>-v0002-<devnet>-<testing>-<program>-<hash of programs/>.
    # The `programs/` hash is last so that everything identifying the build flavour sits in the
    # restore-keys prefix. A PR that touches `programs/**` can never hit the exact key, and with no
    # fallback it paid a cold 14 min build: 24 of 30 runs did. The prefix hands it the newest
    # `target/` for the same anchor version, same devnet/testing flags and same `-p` program --
    # normally the one the develop seed run saved (tests.yaml `build` job, push to develop).
    # A prefix hit leaves `cache-hit` false, so `anchor build` still runs; it just runs warm.
    - name: Cache Anchor Build
      uses: actions/cache@v4
      id: cache-anchor-build
      with:
        path: |
          ./target/
        key: build-${{ runner.os }}-${{env.ANCHOR_VERSION}}-${{env.ANCHOR_SHA}}-v0002-${{ inputs.devnet }}-${{ inputs.testing }}-${{ inputs.program }}-${{ hashFiles('./programs/**/**') }}
        restore-keys: |
          build-${{ runner.os }}-${{env.ANCHOR_VERSION}}-${{env.ANCHOR_SHA}}-v0002-${{ inputs.devnet }}-${{ inputs.testing }}-${{ inputs.program }}-
    # The programs refuse to compile when TESTING is set without HELIUM_TEST_BUILD, so a
    # test build carries both.
    - run: |
        ARGS=()
        if [ -n "$PROGRAM" ]; then ARGS+=(-p "$PROGRAM"); fi
        if [ "$DEVNET" = "true" ]; then ARGS+=(-- --features devnet); fi
        if [ "$TESTING_BUILD" = "true" ]; then
          export TESTING=true HELIUM_TEST_BUILD=true
        fi
        ~/.cargo/bin/anchor build "${ARGS[@]}"
      if: steps.cache-anchor-build.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEVNET: ${{ inputs.devnet }}
        TESTING_BUILD: ${{ inputs.testing }}
        PROGRAM: ${{ inputs.program }}

name: "Build IDLs"
description: "Generate IDL JSON + TS via `anchor idl build` (no BPF compilation), then build @helium/idls. Final artifact (packages/idls/lib) is cached and short-circuits the whole pipeline on hit."

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup/

    # Cache the FINAL consumed artifact. On hit we skip anchor + tsc entirely.
    # Every cache here is split into restore + save, and only develop and master save, as in
    # build-anchor. A save from a `docker-*` tag or a PR ref can be restored by that ref alone, and
    # the 1.3 GB `target/debug` copies they left filled the 10 GB store and evicted the develop
    # seed every PR restores. npm-publish (push to develop) seeds these keys.
    - uses: actions/cache/restore@v4
      name: Restore IDLs final artifact
      id: cache-idls-lib
      with:
        path: |
          ./packages/idls/lib
          ./target/idl
          ./target/types
        key: idls-lib-${{ runner.os }}-v0001-${{ env.ANCHOR_VERSION }}-${{ hashFiles('programs/**/*.rs', 'programs/**/Cargo.toml', 'utils/**/*.rs', 'utils/**/Cargo.toml', 'utils/**/idls/**', 'Cargo.lock', 'Anchor.toml') }}
        restore-keys: |
          idls-lib-${{ runner.os }}-v0001-${{ env.ANCHOR_VERSION }}-

    - uses: ./.github/actions/setup-anchor/
      if: steps.cache-idls-lib.outputs.cache-hit != 'true'

    - uses: actions/cache/restore@v4
      if: steps.cache-idls-lib.outputs.cache-hit != 'true'
      name: Restore Cargo registry + index
      id: cache-cargo-registry
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-idl-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-idl-

    # `anchor idl build` runs `cargo test --features idl-build` on the program lib
    # (NOT a BPF build), so target/debug is what gets populated.
    - uses: actions/cache/restore@v4
      if: steps.cache-idls-lib.outputs.cache-hit != 'true'
      name: Restore cargo target (idl build)
      id: cache-cargo-target
      with:
        path: ./target/debug
        key: cargo-target-idl-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('programs/**/*.rs', 'Cargo.lock') }}
        restore-keys: |
          cargo-target-idl-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-

    - name: Build IDLs (anchor idl build per program)
      if: steps.cache-idls-lib.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The prefix restore above can bring back the output of a removed program.
        rm -rf target/idl target/types packages/idls/lib
        mkdir -p target/idl target/types
        # Extract program names (snake_case) from [programs.localnet] in Anchor.toml
        programs=$(awk '/^\[programs\.localnet\]/{flag=1;next} /^\[/{flag=0} flag && /=/{print $1}' Anchor.toml)
        for program in $programs; do
          echo "::group::IDL build $program"
          anchor idl build -p "$program" \
            -o "target/idl/${program}.json" \
            -t "target/types/${program}.ts" \
            --skip-lint
          echo "::endgroup::"
        done

    - uses: ./.github/actions/setup-ts/
      if: steps.cache-idls-lib.outputs.cache-hit != 'true'

    - name: Build @helium/idls
      if: steps.cache-idls-lib.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm turbo run build --filter=@helium/idls

    - uses: actions/cache/save@v4
      name: Save Cargo registry + index
      if: steps.cache-idls-lib.outputs.cache-hit != 'true' && steps.cache-cargo-registry.outputs.cache-hit != 'true' && (github.ref_name == 'develop' || github.ref_name == 'master')
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-idl-${{ hashFiles('**/Cargo.lock') }}

    - uses: actions/cache/save@v4
      name: Save cargo target (idl build)
      if: steps.cache-idls-lib.outputs.cache-hit != 'true' && steps.cache-cargo-target.outputs.cache-hit != 'true' && (github.ref_name == 'develop' || github.ref_name == 'master')
      with:
        path: ./target/debug
        key: cargo-target-idl-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('programs/**/*.rs', 'Cargo.lock') }}

    - uses: actions/cache/save@v4
      name: Save IDLs final artifact
      if: steps.cache-idls-lib.outputs.cache-hit != 'true' && (github.ref_name == 'develop' || github.ref_name == 'master')
      with:
        path: |
          ./packages/idls/lib
          ./target/idl
          ./target/types
        key: idls-lib-${{ runner.os }}-v0001-${{ env.ANCHOR_VERSION }}-${{ hashFiles('programs/**/*.rs', 'programs/**/Cargo.toml', 'utils/**/*.rs', 'utils/**/Cargo.toml', 'utils/**/idls/**', 'Cargo.lock', 'Anchor.toml') }}

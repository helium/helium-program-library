# Hands the IDL buffer from `write-idl-buffer` to the vault. The caller runs it right before
# the Squads proposal step. Until then the deployer key owns the buffer, so a run that stops
# before the proposal (a skip, a failure, a runner that dies) leaves a buffer the deployer
# key can close: this action's close step or the weekly sweep returns the rent. After the
# transfer only a multisig proposal can close it.
#
# The caller installs the Solana and Anchor CLIs first (`setup-anchor` does it).
name: "Set IDL Buffer Authority"
description: "Hands the IDL buffer to the buffer authority, right before the proposal"
inputs:
  network:
    description: "Solana RPC URL"
    required: true
  program:
    description: "Program name (snake_case), for the run summary"
    required: true
  program-id:
    description: "The program id of the program to upgrade"
    required: true
  keypair:
    description: "The deployer keypair that owns the IDL buffer"
    required: true
  buffer-authority:
    description: "The address that receives the IDL buffer authority (the Squads vault)"
    required: true
  idl-buffer:
    description: "The IDL buffer `write-idl-buffer` wrote or reused"
    required: true

runs:
  using: "composite"
  steps:
    - name: Write keypair
      shell: bash
      run: echo "$DEPLOY_KEYPAIR" > ./deploy-keypair.json && chmod 600 ./deploy-keypair.json
      env:
        DEPLOY_KEYPAIR: ${{ inputs.keypair }}

    # The read after the set makes a success mean the vault holds the buffer, so the close
    # step below never runs on a buffer the vault already owns. A reused IDL buffer is already
    # the vault's, so the first read passes it through.
    - name: Set Buffer Authority
      id: set-buffer-authority
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        shell: bash
        command: |
          if anchor idl authority "$IDL_BUFFER" --provider.cluster "$NETWORK" | grep -q "$AUTHORITY"; then
            echo "IDL buffer authority is already $AUTHORITY"
            exit 0
          fi
          echo "Setting buffer authority..."
          anchor idl set-authority "$IDL_BUFFER" \
            --program-id "$PROGRAM_ID" \
            --new-authority "$AUTHORITY" \
            --provider.cluster "$NETWORK" \
            --priority-fee 100000 \
            --provider.wallet ./deploy-keypair.json
          if ! anchor idl authority "$IDL_BUFFER" --provider.cluster "$NETWORK" | grep -q "$AUTHORITY"; then
            echo "::error::IDL buffer $IDL_BUFFER does not have the authority $AUTHORITY after the set"
            exit 1
          fi
      env:
        PROGRAM_ID: ${{ inputs.program-id }}
        NETWORK: ${{ inputs.network }}
        AUTHORITY: ${{ inputs.buffer-authority }}
        IDL_BUFFER: ${{ inputs.idl-buffer }}

    # Until the authority transfer the deployer key owns the IDL buffer and can take the rent
    # back. The address is the one the caller passed; parallel runs share the deployer key. A
    # failed close warns and leaves the run's own failure as the result. "Re-run failed jobs"
    # then fails on the closed buffer; "Re-run all jobs" writes a new one.
    - name: Close this run's IDL buffer after a failure
      if: (failure() || cancelled()) && steps.set-buffer-authority.outcome != 'success'
      shell: bash
      run: |
        set +e
        CLOSE_OUT=$(anchor idl close "$PROGRAM_ID" --idl-address "$IDL_BUFFER" --provider.cluster "$NETWORK" --provider.wallet ./deploy-keypair.json 2>&1)
        EXIT_CODE=$?
        set -e
        # The RPC URL is a secret and the CLI puts it in some errors.
        CLOSE_OUT=${CLOSE_OUT//"$NETWORK"/<rpc-url>}
        echo "$CLOSE_OUT"
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "- \`$PROGRAM\`: closed IDL buffer \`$IDL_BUFFER\` after the failure. The rent is back with the deployer." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning::IDL buffer $IDL_BUFFER not closed: $(echo "$CLOSE_OUT" | tail -n 1)"
        fi
      env:
        PROGRAM: ${{ inputs.program }}
        PROGRAM_ID: ${{ inputs.program-id }}
        NETWORK: ${{ inputs.network }}
        IDL_BUFFER: ${{ inputs.idl-buffer }}

    - name: Cleanup
      if: always()
      shell: bash
      run: rm -f ./deploy-keypair.json

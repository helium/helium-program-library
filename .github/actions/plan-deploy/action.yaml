# The deploy re-run rules, in front of `deploy-buffers`. All three deploy workflows call
# this action, so devnet and mainnet follow the same rules:
# - the on-chain program already matches the build: stop, write nothing;
# - the vault already owns a buffer with the build's bytes: reuse it;
# - a pending proposal already names the reused buffer: stop;
# - an older pending proposal for the program: go on and report its index.
# Every compare is against ./target/deploy/<program>.so as the caller built it, so a
# `devnet` feature build compares like any other.
#
# It takes no keypair. It installs and runs `@sqds/multisig` and its dependencies, so the
# mainnet release runs it in a job that does not hold the deployer key.
#
# A stop is a success. The caller skips `deploy-buffers` and its Squads step on
# `outputs.skip == 'true'`, because a skipped run has no buffers to pass.
#
# The caller installs the Solana CLI first (`setup-anchor` does it).
name: "Plan Deploy"
description: "Decides whether a deploy writes buffers, reuses a vault buffer, or stops"
inputs:
  devnet:
    description: "Whether the target is devnet"
    required: false
    default: "false"
  network:
    description: "Solana RPC URL"
    required: true
  program:
    description: "Program name (snake_case). The binary is ./target/deploy/<program>.so"
    required: true
  program-id:
    description: "The program id of the program to upgrade"
    required: true
  buffer-authority:
    description: "The Squads vault. Its buffers are the reuse candidates"
    required: true
  multisig:
    description: "The Squads v4 multisig whose pending proposals are read"
    required: true
  spill:
    description: "The spill address the Squads step passes. A pending proposal with another spill does not name the same upgrade"
    required: true
  cache:
    description: "Restore and save the solana-verify and pnpm store caches"
    required: false
    default: "true"

outputs:
  skip:
    description: "'true' when the run stops with success and writes no buffers"
    value: ${{ steps.hash-match.outputs.skip == 'true' || steps.pending.outputs.skip == 'true' }}
  buffer:
    description: "The vault buffer that matches the build. Empty when there is none."
    value: ${{ steps.reuse.outputs.buffer }}
  pending-proposal-index:
    description: "Transaction indexes of older pending upgrade proposals for this program, comma separated. Empty when there are none."
    value: ${{ steps.pending.outputs.older }}

runs:
  using: "composite"
  steps:
    # A job that ran `build-verified` has the binary already. The devnet publish job does
    # not build, so it gets it from the cache.
    - uses: ./.github/actions/install-solana-verify/
      with:
        cache: ${{ inputs.cache }}

    - name: Skip when the on-chain program matches the build
      id: hash-match
      shell: bash
      run: |
        set +e
        ONCHAIN_OUT=$(~/.cargo/bin/solana-verify get-program-hash -u "$NETWORK" "$PROGRAM_ID" 2>&1)
        EXIT_CODE=$?
        set -e
        if [ "$EXIT_CODE" -ne 0 ]; then
          # The RPC URL is a secret and the CLI puts it in some errors.
          echo "${ONCHAIN_OUT//"$NETWORK"/<rpc-url>}"
          echo "::error::Could not read the on-chain hash of $PROGRAM_ID"
          exit 1
        fi
        ONCHAIN_HASH=$(echo "$ONCHAIN_OUT" | tail -n 1)
        BUILD_HASH=$(~/.cargo/bin/solana-verify get-executable-hash "./target/deploy/$PROGRAM.so" | tail -n 1)
        echo "On-chain hash: $ONCHAIN_HASH"
        echo "Build hash:    $BUILD_HASH"

        # The devnet workflows rewrite the lazy signer in the source before the build.
        NOTE=""
        if [ "$DEVNET" = "true" ]; then
          NOTE=" This is a devnet build. Do not compare its hash with a mainnet hash or with the committed source."
        fi

        if [ "$ONCHAIN_HASH" = "$BUILD_HASH" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "- \`$PROGRAM\`: the on-chain program already has the build hash \`$BUILD_HASH\`. Skipped: no buffer, no proposal.$NOTE" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "- \`$PROGRAM\`: build hash \`$BUILD_HASH\`, on-chain hash \`$ONCHAIN_HASH\`.$NOTE" >> "$GITHUB_STEP_SUMMARY"
        fi
      env:
        DEVNET: ${{ inputs.devnet }}
        PROGRAM: ${{ inputs.program }}
        PROGRAM_ID: ${{ inputs.program-id }}
        NETWORK: ${{ inputs.network }}

    # A run that failed after the authority transfer leaves a vault-owned buffer that only a
    # Squads proposal can close. A re-run that runs this step again takes it back instead of
    # paying rent for a second. In the mainnet release that is "Re-run all jobs": "Re-run failed
    # jobs" keeps the plan job's old empty `reused-buffer` output and writes a second buffer.
    - name: Reuse a vault buffer that matches the build
      id: reuse
      if: steps.hash-match.outputs.skip != 'true'
      shell: bash
      run: |
        set +e
        BUFFERS_OUT=$(solana program show --buffers --buffer-authority "$AUTHORITY" -u "$NETWORK" --output json 2>&1)
        EXIT_CODE=$?
        set -e
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "${BUFFERS_OUT//"$NETWORK"/<rpc-url>}"
          echo "::error::Could not list the buffers of $AUTHORITY"
          exit 1
        fi

        # A parse failure must stop the run, not read as "no buffers".
        CANDIDATES=$(echo "$BUFFERS_OUT" | jq -r '.buffers[].address')

        DUMPED_BUFFER=$(mktemp ./buffer-dump.XXXXXX.so)
        trap 'rm -f "$DUMPED_BUFFER"' EXIT
        for CANDIDATE in $CANDIDATES; do
          if solana program dump "$CANDIDATE" "$DUMPED_BUFFER" -u "$NETWORK" > /dev/null 2>&1 \
            && cmp -s "./target/deploy/$PROGRAM.so" "$DUMPED_BUFFER"; then
            echo "Buffer $CANDIDATE matches the build"
            echo "buffer=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "- \`$PROGRAM\`: reused buffer \`$CANDIDATE\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Buffer $CANDIDATE does not match the build"
        done
        echo "No vault-owned buffer matches the build"
      env:
        PROGRAM: ${{ inputs.program }}
        AUTHORITY: ${{ inputs.buffer-authority }}
        NETWORK: ${{ inputs.network }}

    # The proposal read needs `@sqds/multisig` from the workspace. Every action here is
    # pinned to a commit and the install takes the lockfile as is, with no install scripts.
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      if: steps.hash-match.outputs.skip != 'true'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      if: steps.hash-match.outputs.skip != 'true'
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - run: pnpm install --frozen-lockfile --ignore-scripts
      if: steps.hash-match.outputs.skip != 'true'
      shell: bash

    # The proposal is created against a public RPC. The read uses the RPC the buffer
    # writes use.
    - name: Stop when a pending proposal names the reused buffer
      id: pending
      if: steps.hash-match.outputs.skip != 'true'
      uses: ./.github/actions/pending-proposals/
      with:
        network: ${{ inputs.network }}
        program: ${{ inputs.program }}
        program-id: ${{ inputs.program-id }}
        multisig: ${{ inputs.multisig }}
        spill: ${{ inputs.spill }}
        buffer: ${{ steps.reuse.outputs.buffer }}

    - name: Report older pending proposals
      if: steps.pending.outputs.older != ''
      shell: bash
      run: |
        echo "- \`$PROGRAM\`: older pending upgrade proposal(s) $OLDER do not match this build. This run makes a new proposal. Signers reject the older one(s)." >> "$GITHUB_STEP_SUMMARY"
      env:
        PROGRAM: ${{ inputs.program }}
        OLDER: ${{ steps.pending.outputs.older }}
